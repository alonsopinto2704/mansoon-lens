<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MonsoonLens corrects district rainfall forecasts for the monsoon regime behind them and serves the correction only where held-out verification shows it helps." />
    <meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1520" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23155d70'/%3E%3Ccircle cx='16' cy='14' r='7' fill='none' stroke='white' stroke-width='2'/%3E%3Ccircle cx='16' cy='14' r='2.5' fill='white'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Serif:ital@0;1&display=swap" />
    <title>MonsoonLens · District rainfall forecasts</title>
    <script>
      try {
        var t = localStorage.getItem('ml-theme');
        document.documentElement.dataset.theme = t === 'light' || t === 'dark' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch (e) {}
      // Start the big data downloads with the app bundle instead of after the page and map chunks load.
      ['/api/v1/live?cached=1'].concat(/^\/(method|upload)\/?$/.test(location.pathname) ? [] : ['/api/v1/geo/districts', '/api/v1/geo/states']).forEach(function (href) {
        var link = document.createElement('link');
        link.rel = 'preload'; link.as = 'fetch'; link.crossOrigin = 'anonymous'; link.href = href;
        document.head.appendChild(link);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
